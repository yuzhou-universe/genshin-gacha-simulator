{% extends "base.html" %}
{% block title %}注册 · {{ app_name }}{% endblock %}
{% block body_class %}auth-body{% endblock %}
{% block main_class %}auth-page{% endblock %}

{% block content %}
<div class="auth-card">
  <div class="auth-card__glow" aria-hidden="true"></div>

  <h1 class="auth-card__title">创建账号</h1>
  <p class="auth-card__subtitle">注册即赠初始原石与缘结</p>

  <form class="auth-form" data-auth-form="/auth/register" novalidate>
    <label class="field">
      <span class="field__label">用户名</span>
      <input class="field__input" type="text" name="username" autocomplete="username"
             required minlength="3" maxlength="20" placeholder="3-20 位中英文、数字或下划线">
    </label>

    <label class="field">
      <span class="field__label">密码</span>
      <input class="field__input" type="password" name="password" autocomplete="new-password"
             required minlength="8" placeholder="至少 8 位，含字母和数字">
    </label>

    <p class="form-error" data-error hidden></p>

    <button class="btn btn--primary btn--block" type="submit">注 册</button>
  </form>

  <p class="auth-card__footer">
    已有账号？<a href="/login">返回登录</a>
  </p>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/auth.js"></script>
{% endblock %}
