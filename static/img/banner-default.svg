<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"
     preserveAspectRatio="xMidYMid slice" role="img" aria-label="默认卡池背景：晴空与云">
  <defs>
    <!-- 自上而下：高空偏蓝 → 近地平线泛白 -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7fbde3"/>
      <stop offset="34%"  stop-color="#a8d5ee"/>
      <stop offset="68%"  stop-color="#d5ebf7"/>
      <stop offset="100%" stop-color="#f2fafd"/>
    </linearGradient>

    <!-- 地平线附近的暖调辉光，避免整张图偏冷 -->
    <radialGradient id="warmGlow" cx="50%" cy="88%" r="55%">
      <stop offset="0%"   stop-color="#fff6dd" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#fff6dd" stop-opacity="0"/>
    </radialGradient>

    <!-- 云朵：中心白、边缘透明 -->
    <radialGradient id="cloud" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="62%"  stop-color="#ffffff" stop-opacity=".6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cloudDim" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#eaf4fb" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#eaf4fb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- 远处淡云：先铺大的、低对比的 -->
  <g opacity=".55">
    <ellipse cx="250"  cy="215" rx="215" ry="62" fill="url(#cloudDim)"/>
    <ellipse cx="1180" cy="160" rx="260" ry="70" fill="url(#cloudDim)"/>
    <ellipse cx="760"  cy="120" rx="190" ry="52" fill="url(#cloudDim)"/>
    <ellipse cx="1450" cy="330" rx="200" ry="58" fill="url(#cloudDim)"/>
  </g>

  <!-- 中景云团：由多个椭圆叠成一朵，比单个椭圆自然 -->
  <g opacity=".85">
    <g>
      <ellipse cx="330"  cy="400" rx="150" ry="58" fill="url(#cloud)"/>
      <ellipse cx="430"  cy="378" rx="120" ry="62" fill="url(#cloud)"/>
      <ellipse cx="245"  cy="392" rx="96"  ry="44" fill="url(#cloud)"/>
    </g>
    <g>
      <ellipse cx="1230" cy="452" rx="175" ry="64" fill="url(#cloud)"/>
      <ellipse cx="1345" cy="424" rx="128" ry="66" fill="url(#cloud)"/>
      <ellipse cx="1120" cy="440" rx="104" ry="46" fill="url(#cloud)"/>
    </g>
    <g>
      <ellipse cx="790"  cy="286" rx="132" ry="48" fill="url(#cloud)"/>
      <ellipse cx="880"  cy="268" rx="100" ry="52" fill="url(#cloud)"/>
    </g>
  </g>

  <!-- 近景云海：底部厚一些，把地平线藏进云里 -->
  <g opacity=".92">
    <ellipse cx="180"  cy="790" rx="330" ry="120" fill="url(#cloud)"/>
    <ellipse cx="620"  cy="828" rx="420" ry="132" fill="url(#cloud)"/>
    <ellipse cx="1120" cy="800" rx="380" ry="124" fill="url(#cloud)"/>
    <ellipse cx="1520" cy="836" rx="300" ry="112" fill="url(#cloud)"/>
  </g>

  <rect width="1600" height="900" fill="url(#warmGlow)"/>
</svg>
