<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320" role="img" aria-label="五星占位图">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%"   stop-color="#fdfbf5"/>
      <stop offset="55%"  stop-color="#f6efdd"/>
      <stop offset="100%" stop-color="#eadfc4"/>
    </linearGradient>

    <radialGradient id="halo" cx="50%" cy="40%" r="62%">
      <stop offset="0%"   stop-color="#fff3cf" stop-opacity=".95"/>
      <stop offset="50%"  stop-color="#ffb13f" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#ffb13f" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f0cf82"/>
      <stop offset="55%"  stop-color="#d9a441"/>
      <stop offset="100%" stop-color="#a97c22"/>
    </linearGradient>
  </defs>

  <rect width="240" height="320" rx="14" fill="url(#cardBg)"/>
  <circle cx="120" cy="128" r="100" fill="url(#halo)"/>

  <!-- 星形徽记 -->
  <path d="M120 52 L137 104 L192 104 L147 136 L164 188 L120 156 L76 188 L93 136 L48 104 L103 104 Z"
        fill="url(#frame)" opacity=".9"/>

  <!-- 内描边用金色，外描边压深一档保证在浅底上仍有边界感 -->
  <rect x="6" y="6" width="228" height="308" rx="12" fill="none"
        stroke="url(#frame)" stroke-width="2.5"/>
  <rect x="1" y="1" width="238" height="318" rx="14" fill="none"
        stroke="rgba(120,90,30,.28)" stroke-width="1"/>

  <text x="120" y="262" text-anchor="middle" font-family="Georgia, serif"
        font-size="17" fill="#a97c22" letter-spacing="3">五星</text>
  <text x="120" y="288" text-anchor="middle" font-family="sans-serif"
        font-size="11" fill="#9fabb8" letter-spacing="1">暂无立绘</text>
</svg>
