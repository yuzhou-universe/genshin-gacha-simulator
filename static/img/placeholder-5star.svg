<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320" role="img" aria-label="五星占位图">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="62%">
      <stop offset="0%"   stop-color="#fff3cf" stop-opacity=".95"/>
      <stop offset="45%"  stop-color="#ffb13f" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ffb13f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffe9b8"/>
      <stop offset="55%"  stop-color="#d3a244"/>
      <stop offset="100%" stop-color="#8a6420"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#2e3b55"/>
      <stop offset="100%" stop-color="#151d2e"/>
    </linearGradient>
  </defs>

  <rect width="240" height="320" rx="14" fill="url(#body)"/>
  <circle cx="120" cy="134" r="104" fill="url(#glow)"/>

  <!-- 星形徽记 -->
  <path d="M120 56 L137 108 L192 108 L147 140 L164 192 L120 160 L76 192 L93 140 L48 108 L103 108 Z"
        fill="url(#frame)" opacity=".92"/>

  <rect x="6" y="6" width="228" height="308" rx="12" fill="none"
        stroke="url(#frame)" stroke-width="2.5" opacity=".85"/>

  <text x="120" y="262" text-anchor="middle" font-family="Georgia, serif"
        font-size="17" fill="#ffe9b8" letter-spacing="3">五星</text>
  <text x="120" y="288" text-anchor="middle" font-family="sans-serif"
        font-size="11" fill="#a8b0c0" letter-spacing="1">暂无立绘</text>
</svg>
