# NOTE: This file is read by alembic using the SYSTEM LOCALE encoding
# (encoding="locale"), NOT utf-8. On a Chinese Windows box that means GBK.
# Keep this file pure ASCII -- any non-ASCII comment will crash alembic with
# UnicodeDecodeError on machines whose locale differs from the file encoding.
# Put localized notes in alembic/env.py (a normal utf-8 Python file) instead.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# The database URL is NOT hardcoded here. alembic/env.py reads it from
# app.core.config (i.e. from .env / environment variables), so migrations and
# the running app always point at the same database.
sqlalchemy.url =

[post_write_hooks]
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = -l 100

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
